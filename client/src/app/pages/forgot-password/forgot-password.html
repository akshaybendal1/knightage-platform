<div class="login-wrap">
  <div class="login-card card">
    <div class="card-body">
      <div class="login-wordmark">
        <span class="login-wordmark-primary">Knightage</span><span class="login-wordmark-accent">Platform</span>
      </div>

      @if (sent()) {
        <h2 class="login-heading">Check your email</h2>
        <p class="text-muted text-center">If that email exists, we've sent a reset link. It expires in 1 hour.</p>
        <p class="login-footer">
          <a routerLink="/login">Back to login</a>
        </p>
      } @else {
        <h2 class="login-heading">Forgot your password?</h2>
        <p class="text-muted text-center mb-3">Enter your email and we'll send you a reset link.</p>
        <form (ngSubmit)="submit()">
          <div class="form-group mb-4">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" required />
          </div>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
            {{ loading() ? 'Sending...' : 'Send reset link' }}
          </button>

          <p class="login-footer">
            <a routerLink="/login">Back to login</a>
          </p>
        </form>
      }
    </div>
  </div>
</div>
