<div class="login-wrap">
  <div class="login-card card">
    <div class="card-body">
      <div class="login-wordmark">
        <span class="login-wordmark-primary">Knightage</span><span class="login-wordmark-accent">Platform</span>
      </div>

      @if (linkInvalid()) {
        <h2 class="login-heading">Link invalid or expired</h2>
        <p class="text-muted text-center">This password reset link is invalid or has expired.</p>
        <p class="login-footer">
          <a routerLink="/forgot-password">Request a new link</a>
        </p>
      } @else {
        <h2 class="login-heading">Reset your password</h2>
        <form (ngSubmit)="submit()">
          <div class="form-group mb-3">
            <label class="form-label" for="newPassword">New password</label>
            <div class="password-field">
              <input
                id="newPassword"
                name="newPassword"
                [type]="showNewPassword() ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="newPassword"
                required
                minlength="8"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="showNewPassword.set(!showNewPassword())"
                [attr.aria-label]="showNewPassword() ? 'Hide password' : 'Show password'"
              >
                <i class="fa" [class.fa-eye]="!showNewPassword()" [class.fa-eye-slash]="showNewPassword()"></i>
              </button>
            </div>
          </div>
          <div class="form-group mb-4">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="password-field">
              <input
                id="confirmPassword"
                name="confirmPassword"
                [type]="showConfirmPassword() ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="confirmPassword"
                required
                minlength="8"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="showConfirmPassword.set(!showConfirmPassword())"
                [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
              >
                <i class="fa" [class.fa-eye]="!showConfirmPassword()" [class.fa-eye-slash]="showConfirmPassword()"></i>
              </button>
            </div>
          </div>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
            {{ loading() ? 'Saving...' : 'Reset password' }}
          </button>
        </form>
      }
    </div>
  </div>
</div>
